# Path-traversal patterns for Java (design §10.1). Data, never code — adding a
# sink here is the whole change; no tool or agent is edited.
#
# Structure: named blocks whose INNER KEYS ARE QUERY PARAMETER NAMES, plus a
# `queries` section binding each named query to the blocks it takes. Identical
# in shape to sqli's pattern file, which is the point: this class was added
# without touching a query, a tool or a schema.
#
# THE SINK SHAPE HERE IS THE RECEIVER, NOT AN ARGUMENT — `arg_index: "0"`.
# `file.createNewFile()` carries no argument at all; the tainted path lives in
# the object the call is made on, and Joern indexes the receiver as argument 0
# (verified on WebGoat: arg 0 of ProfileUploadBase:52 is `uploadedFile`, arg 1
# is empty). This is what lets one generic dataflow query serve a class whose
# sinks look nothing like SQLi's.
#
# THE GAP THIS FILE USED TO HAVE, and why it is worth remembering. `arg_index` was
# a single position, so this class bound only `0` — the receiver — because that is
# the shape WebGoat's lesson uses. Measured on a fixture of ordinary Java idioms,
# that made `Files.readAllBytes(Paths.get(dir + p))` invisible: the query could see
# it perfectly well, the manifest simply had no way to ask. A corpus had shaped a
# capability, which is what overfitting means, and the binary metrics on that
# corpus were 1.0 throughout and could never have shown it.
#
# `arg_index` now takes several positions, so this class binds 0, 1 and 2:
#   0  the RECEIVER — `file.createNewFile()` carries no argument at all and the
#      tainted path lives in the object the call is made on
#   1  static path APIs and one-argument constructors — `Files.readAllBytes(p)`,
#      `Paths.get(s)`, `new FileInputStream(p)`
#   2  the second component of a two-argument constructor — `new File(dir, name)`

class: path_traversal
language: java

sources:
  # Same source vocabulary as sqli, unchanged and already corpus-proven: a
  # request parameter is a request parameter whatever the sink does with it.
  # Reusing it verbatim is evidence the seam is real — the block is the class's
  # to choose, and this class chose the same one.
  annotations:
    - RequestParam
    - PathVariable
    - RequestBody
    - RequestHeader
    - CookieValue
  calls:
    - getParameter
    - getParameterValues
    - getHeader
    - getQueryString
    - getCookies
    - getInputStream
    - getReader

sinks:
  # THREE SHAPES, each probed only where its taint actually lands. A single list of
  # positions for the whole class fixed the blindness but asked every sink about
  # every position — a static call about its receiver, a constructor about the
  # object being built. Groups keep the coverage and drop the nonsense.
  sink_groups:
    # 1. Filesystem access on a tainted RECEIVER. `file.createNewFile()` carries no
    #    argument at all; the path lives in the object the call is made on, which
    #    Joern indexes as argument 0.
    - sinks:
        - createNewFile
        - mkdir
        - mkdirs
        - delete
        - deleteOnExit
        - renameTo
        - listFiles
        - exists
        - isFile
        - isDirectory
        - canRead
        - canWrite
        - setReadable
        - setWritable
        - transferTo
      full_name_filter: []
      arg_index: "0"

    # 2. Static path APIs — the path is an ARGUMENT. None of these occurs anywhere
    #    in WebGoat, which is the point: they are the common form in modern Java, so
    #    the corpus has no example of the shape most client code will use.
    - sinks:
        - readAllBytes
        - readAllLines
        - readString
        - newInputStream
        - newOutputStream
        - newBufferedReader
        - newBufferedWriter
        - copy
        - move
        - walk
        - createDirectories
        - createFile
        - deleteIfExists
      full_name_filter:
        - "^java\\.nio\\.file\\.(Files|Paths|Path)\\..*"
      arg_index: "1,2"

    # 3. Path CONSTRUCTION. Every constructor in the tree is called `<init>` (490 of
    #    them on WebGoat), so the bare name carries nothing and the filter is what
    #    makes this nameable at all. Argument 1 is `new File(userPath)`; argument 2
    #    is `new File(dir, name)`, which is WebGoat's own ProfileUploadBase:51.
    - sinks:
        - <init>
      full_name_filter:
        - "^java\\.io\\.File\\.<init>.*"
        - "^java\\.io\\.File(Input|Output)Stream\\.<init>.*"
        - "^java\\.io\\.RandomAccessFile\\.<init>.*"
        - "^java\\.util\\.zip\\.ZipFile\\.<init>.*"
      arg_index: "1,2"

  # MEASURED NOISE, excluded rather than filtered. On WebGoat at arg 0:
  #   `length`  25 hits, 23 of them java.lang.String.length  — 8% precision
  #   `list`     1 hit,  java.util.Collections.list          — 0% precision
  # Both are legitimate java.io.File methods and both are useless as short-name
  # sinks; a filter for their sake would drop every unresolved hit for the others.

sanitizers:
  # CANDIDATES ONLY. Presence on a path is a fact; effectiveness is a belief
  # decided against the belief store (§4). WebGoat's ProfileUploadFix strips
  # with replace("../", "") — bypassable with `....//`, which reconstitutes the
  # traversal after the replacement — so a manifest treating this list as
  # "safe" would launder a live bug into a false negative, exactly as it would
  # for SqlInjectionLesson8.
  sanitizers:
    # Canonicalization and containment — the real fix when the RESULT is then
    # checked. Listed as candidates so the reviewer sees the defence on the
    # path; whether the check that follows is sound is a belief, not a fact.
    - getCanonicalPath
    - getCanonicalFile
    - toRealPath
    - normalize
    - startsWith
    - getName
    # Textual defences — usually the bug rather than the fix.
    - replace
    - replaceAll
    - matches
    - contains
    - substring
    - escape.*
    - encode.*
    - sanitize.*
    - validate.*
  sanitizer_full_name_filter: []

# Which named query takes which blocks. Referenced blocks are merged in order.
# Identical bindings to sqli — the queries are class-agnostic by construction.
queries:
  sql_sinks:         [sinks]
  request_sources:   [sources]
  reachable:         [sources, sinks]
  sanitizer_on_path: [sources, sinks, sanitizers]

# struct_grep rule sets for this class+language (§10.3 rule catalog).
rules:
  - java/path_traversal

# Verification ceiling for THIS language (§6). Guarded: the loader rejects a
# tier whose queries are not bound above.
# Frameworks whose vocabulary this file carries. Declaring them buys ONE
# thing: `manifest detect` can say a framework is present in the source and
# covered by nothing. It selects nothing and filters nothing — a class's
# sinks are always the union of its language-level and framework-level
# entries, because a framework that prevents a bug is exactly why its escape
# hatches matter, and people write plain unsafe code beside them.
frameworks: [spring, jakarta_servlet]

max_static_tier: static_reachability
