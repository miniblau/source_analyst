[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source_analyst"
version = "0.0.1"
description = "LLM-orchestrated source review on a deterministic substrate. JSONL in, JSONL out."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cpg = "source_analyst.cpg.cli:main"

[tool.setuptools.packages.find]
include = ["source_analyst*"]
