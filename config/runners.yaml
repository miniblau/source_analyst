# Agent runners (design §7) — the seam between the deterministic layer and a model.
#
# THIS FILE IS THE ONLY PLACE A PROVIDER OR MODEL NAME MAY APPEAR. `run_agent`
# knows how to spawn a process and how to read JSONL back; it knows nothing about
# any vendor, and no code under source_analyst/ names one. That is what keeps the
# §7 model-agnostic claim true rather than aspirational — swapping the model here
# changes no code and no test.
#
# Contract a runner MUST satisfy:
#   stdin   the agent prompt (agents/<agent>.md) followed by the briefing JSONL
#   stdout  one JSON object per line, and nothing else that matters
#   exit 0  on success
# Anything on stdout that is not a JSON object is discarded and counted; the
# count is reported, because a model that mostly emitted prose is a fact about
# that model worth seeing rather than silently cleaning up.
#
# Placeholders in `cmd`: {agent} {model} {prompt} {repo}

default: stub

runners:
  # Deterministic, no model. Replays a recorded transcript so the whole chain is
  # testable with zero model calls (CLAUDE.md: determinism first).
  stub:
    cmd: ["python3", "{repo}/tests/stub_runner.py", "{agent}"]
    timeout: 60

  # ANY OpenAI-compatible /chat/completions endpoint — llama.cpp's llama-server,
  # Ollama's /v1, LM Studio, vLLM, an internal gateway, a hosted API. Which one is
  # LLM_BASE_URL and LLM_MODEL in the environment, not a line in this file, so the
  # same runner follows you from the desk to work without an edit here.
  #
  #   llama-server -m <gguf> -c 32768 --host 127.0.0.1 --port 8080
  #   LLM_BASE_URL=http://127.0.0.1:8080/v1 LLM_MODEL=local
  #
  # Keep the server WARM across chunks, exactly as the Joern server stays warm:
  # a 20GB model reloaded per batch costs more than the inference.
  openai_compat:
    cmd: ["python3", "{repo}/tools/openai_chat.py",
          "--schema", "{repo}/config/schemas/{agent}.json"]
    timeout: 1800

  # Same endpoint, unconstrained output — for a model or server with no support for
  # constrained decoding, and for measuring how well a model follows the format on
  # its own. Which of the two you used shows up as `schema` in the run meta.
  openai_compat_free:
    cmd: ["python3", "{repo}/tools/openai_chat.py"]
    timeout: 1800

  # Ollama's own CLI, if you would rather not run a server.
  ollama:
    cmd: ["ollama", "run", "{model}"]
    model: qwen3-coder:30b
    timeout: 1800

  # §7's intended host. Verified against opencode 1.18.23 on 2026-08-25.
  #
  # It goes through tools/opencode_run.py rather than calling the binary directly,
  # because `opencode run` takes its message as an argv positional and never reads
  # stdin — piping a briefing at it hangs until the timeout. The shim also runs it
  # out of a scratch home holding only config/opencode/judge.md, since opencode
  # injects any AGENTS.md/CLAUDE.md in the working tree into the system prompt: in
  # this repo that is the 16KB operating contract, measured at 86s vs 12s per call.
  #
  # NO CONSTRAINED DECODING — opencode exposes no schema hook, so this is the peer
  # of openai_compat_free, not of openai_compat. Do not compare its scorecard
  # against a constrained run and read the difference as judgement.
  #
  # `model` is provider/model as opencode names it; the provider itself is defined
  # in ~/.config/opencode/opencode.jsonc. Keep provider config OUT of a project
  # .opencode/opencode.json — opencode then hunts for the provider's npm package in
  # a directory that has none and hangs silently instead of failing.
  opencode:
    cmd: ["python3", "{repo}/tools/opencode_run.py",
          "--repo", "{repo}", "--model", "{model}", "--title", "{agent}"]
    model: llamacpp/Qwen3-Coder-30B-A3B-Instruct-UD-Q5_K_XL
    timeout: 1800

# Per-agent overrides. Judgement and prose are different jobs and may deserve
# different models; that decision is data, made here.
agents: {}
