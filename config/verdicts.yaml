# Belief verdict vocabulary (design §5). Data, so the trust language is
# reviewable and extending it is not a code change.
#
# A belief is keyed on subject+predicate+object and records ONE audited trust
# decision, so that later runs prune instead of re-litigating. The verdict says
# what the audit concluded; `prunes` says whether a path through this subject
# may be dropped without further work.
#
# `unsound` is not the absence of a verdict — it is a positive finding that the
# thing does NOT hold, and it is the most valuable entry here. WebGoat's
# SqlInjectionLesson8 escapes with replace('\'', '"') on a still-exploitable
# path: recording that once is what stops it looking like a sanitizer forever.

sound:
  claim: audited and holds — paths through this subject may be pruned
  prunes: true

unsound:
  claim: audited and does NOT hold; a path through this subject still reaches
  prunes: false

partial:
  claim: holds only under stated conditions — the rationale carries them
  prunes: false

unknown:
  claim: audited inconclusively; recorded so the next run does not redo the work
  prunes: false
